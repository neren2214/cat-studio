<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7d9c4"/>
      <stop offset="100%" stop-color="#f0b98d"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg1)"/>
  <!-- ears -->
  <polygon points="120,90 150,20 175,95" fill="#d97b3f"/>
  <polygon points="225,95 250,20 280,90" fill="#d97b3f"/>
  <polygon points="130,85 150,45 165,88" fill="#f2a15f"/>
  <polygon points="235,88 250,45 270,85" fill="#f2a15f"/>
  <!-- head -->
  <ellipse cx="200" cy="170" rx="105" ry="90" fill="#e8935a"/>
  <!-- stripes -->
  <path d="M120,110 q15,-15 30,-5" stroke="#c46a34" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M105,140 q20,-12 38,-3" stroke="#c46a34" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M280,110 q-15,-15 -30,-5" stroke="#c46a34" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M295,140 q-20,-12 -38,-3" stroke="#c46a34" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- face patch -->
  <ellipse cx="200" cy="205" rx="70" ry="50" fill="#fbe4cf"/>
  <!-- eyes -->
  <ellipse cx="165" cy="170" rx="14" ry="18" fill="#2f2b26"/>
  <ellipse cx="235" cy="170" rx="14" ry="18" fill="#2f2b26"/>
  <circle cx="169" cy="164" r="4" fill="#fff"/>
  <circle cx="239" cy="164" r="4" fill="#fff"/>
  <!-- nose -->
  <polygon points="200,190 190,202 210,202" fill="#a85a3d"/>
  <!-- mouth -->
  <path d="M200,202 q0,10 -15,14" stroke="#7a4326" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M200,202 q0,10 15,14" stroke="#7a4326" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- whiskers -->
  <path d="M130,195 q-40,-5 -55,-2" stroke="#fff" stroke-width="2.5" fill="none" opacity="0.85"/>
  <path d="M130,208 q-40,5 -55,8" stroke="#fff" stroke-width="2.5" fill="none" opacity="0.85"/>
  <path d="M270,195 q40,-5 55,-2" stroke="#fff" stroke-width="2.5" fill="none" opacity="0.85"/>
  <path d="M270,208 q40,5 55,8" stroke="#fff" stroke-width="2.5" fill="none" opacity="0.85"/>
</svg>
